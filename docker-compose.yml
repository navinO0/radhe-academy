services:
  postgres:
    image: postgres:16-alpine
    container_name: radhe-academy-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: raadhe_academy
    volumes:
      - radhe_academy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d raadhe_academy"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  radhe_academy_pgdata:
    name: radhe_academy_pgdata

